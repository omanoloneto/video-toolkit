name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent "Video Toolkit.app" \
            "VideoToolkit-${GITHUB_REF_NAME#v}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/VideoToolkit-*-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip runner
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "VideoToolkit-$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: VideoToolkit-*-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev mpv imagemagick
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=pkg
          APPDIR="$PKG/usr/lib/video-toolkit"
          mkdir -p "$APPDIR" "$PKG/usr/bin" "$PKG/DEBIAN" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/x64/release/bundle/. "$APPDIR/"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: video-toolkit
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg
          Maintainer: omanoloneto <mano.afonso93@gmail.com>
          Description: Video Toolkit - editor de faixas de audio, video e legendas (MP4/MKV)
           Editor visual de faixas com linha do tempo, preview e
           processamento via FFmpeg, feito em Flutter.
          EOF

          ln -s ../lib/video-toolkit/video_toolkit \
            "$PKG/usr/bin/video-toolkit"

          convert assets/icon/icon.png -resize 256x256 \
            "$PKG/usr/share/icons/hicolor/256x256/apps/video-toolkit.png"

          cat > "$PKG/usr/share/applications/video-toolkit.desktop" <<EOF
          [Desktop Entry]
          Name=Video Toolkit
          Comment=Editor de faixas de audio, video e legendas
          Exec=video-toolkit %f
          Icon=video-toolkit
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;AudioVideoEditing;
          MimeType=video/mp4;video/x-matroska;
          EOF

          dpkg-deb --build --root-owner-group "$PKG" \
            "video-toolkit_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: video-toolkit_*_amd64.deb

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VideoToolkit-*-macos.zip
            VideoToolkit-*-windows.zip
            video-toolkit_*_amd64.deb
          generate_release_notes: true
          body: |
            Video Toolkit — editor visual de faixas de áudio, vídeo e
            legendas para MP4/MKV (timeline, preview, temas e FFmpeg).

            **Requisito em todas as plataformas: FFmpeg instalado.**
            - macOS: `brew install ffmpeg` · descompacte o zip e arraste o
              app para Aplicativos. Na primeira abertura use botão direito →
              Abrir (app não assinado).
            - Windows: `winget install ffmpeg` · descompacte o zip e execute
              `video_toolkit.exe`.
            - Linux (Debian/Ubuntu): `sudo apt install ./video-toolkit_*_amd64.deb`
              (o FFmpeg entra como dependência).
