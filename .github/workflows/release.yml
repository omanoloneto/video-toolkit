name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip app bundle
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent audio_video_editor.app \
            "AudioVideoEditor-${GITHUB_REF_NAME#v}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/AudioVideoEditor-*-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Zip runner
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "AudioVideoEditor-$version-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: AudioVideoEditor-*-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev mpv imagemagick
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Build .deb package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG=pkg
          APPDIR="$PKG/usr/lib/audio-video-editor"
          mkdir -p "$APPDIR" "$PKG/usr/bin" "$PKG/DEBIAN" \
            "$PKG/usr/share/applications" \
            "$PKG/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/x64/release/bundle/. "$APPDIR/"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: audio-video-editor
          Version: $VERSION
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg
          Maintainer: omanoloneto <mano.afonso93@gmail.com>
          Description: Editor de faixas de audio, video e legendas (MP4/MKV)
           Editor visual de faixas com linha do tempo, preview e
           processamento via FFmpeg, feito em Flutter.
          EOF

          ln -s ../lib/audio-video-editor/audio_video_editor \
            "$PKG/usr/bin/audio-video-editor"

          convert assets/icon/icon.png -resize 256x256 \
            "$PKG/usr/share/icons/hicolor/256x256/apps/audio-video-editor.png"

          cat > "$PKG/usr/share/applications/audio-video-editor.desktop" <<EOF
          [Desktop Entry]
          Name=Editor de Faixas
          Comment=Editor de faixas de audio, video e legendas
          Exec=audio-video-editor %f
          Icon=audio-video-editor
          Terminal=false
          Type=Application
          Categories=AudioVideo;Video;AudioVideoEditing;
          MimeType=video/mp4;video/x-matroska;
          EOF

          dpkg-deb --build --root-owner-group "$PKG" \
            "audio-video-editor_${VERSION}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: audio-video-editor_*_amd64.deb

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            AudioVideoEditor-*-macos.zip
            AudioVideoEditor-*-windows.zip
            audio-video-editor_*_amd64.deb
          generate_release_notes: true
          body: |
            Editor de Faixas — editor visual de faixas de áudio, vídeo e
            legendas para MP4/MKV (timeline, preview, temas e FFmpeg).

            **Requisito em todas as plataformas: FFmpeg instalado.**
            - macOS: `brew install ffmpeg` · descompacte o zip e arraste o
              app para Aplicativos. Na primeira abertura use botão direito →
              Abrir (app não assinado).
            - Windows: `winget install ffmpeg` · descompacte o zip e execute
              `audio_video_editor.exe`.
            - Linux (Debian/Ubuntu): `sudo apt install ./audio-video-editor_*_amd64.deb`
              (o FFmpeg entra como dependência).
