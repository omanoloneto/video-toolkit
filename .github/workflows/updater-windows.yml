name: Atualização no Windows

on:
  pull_request:
    paths:
      - lib/services/updater.dart
      - tool/windows_update_check.dart
      - .github/workflows/updater-windows.yml
  workflow_dispatch:

jobs:
  troca:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run tool/windows_update_check.dart
